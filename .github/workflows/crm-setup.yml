# Instala e mantém o banco do IA.centrism CRM sem precisar de nada na
# máquina de ninguém: o GitHub roda, os segredos ficam no cofre do
# repositório (Settings → Secrets and variables → Actions).
#
# Uso: aba Actions → "CRM — banco" → Run workflow → escolha a ação.
name: CRM — banco

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        required: true
        default: status
        options:
          - status     # só conferir o que já foi aplicado
          - migrate    # aplicar as migrations pendentes
          - setup      # migrations + dono/organização + conferência
          - conferir   # testar um ambiente já publicado (API e site)
      organizacao:
        description: 'Nome da empresa (só na ação setup)'
        type: string
        required: false
        default: IA.centrism
      nome_do_dono:
        description: 'Nome do dono (só na ação setup)'
        type: string
        required: false
        default: Administrador
      api_url:
        description: 'Endereço da API publicada (só na ação conferir)'
        type: string
        required: false
      site_url:
        description: 'Endereço do site na Vercel (só na ação conferir)'
        type: string
        required: false

concurrency: crm-banco

jobs:
  banco:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ia-api
    env:
      # Session pooler do Supabase (porta 5432): migrations são DDL em
      # transação, o que o Transaction pooler (6543) não aceita — e a
      # conexão direta só existe em IPv6, que o runner do GitHub não tem.
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_SSL: require
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      OWNER_NAME: ${{ inputs.nome_do_dono }}
      ORGANIZATION_NAME: ${{ inputs.organizacao }}
      API_URL: ${{ inputs.api_url }}
      SITE_URL: ${{ inputs.site_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-ia-api/package-lock.json

      - run: npm ci

      - name: Conferir os segredos
        run: |
          faltando=()
          if [ "${{ inputs.acao }}" = "conferir" ]; then
            if [ -z "$API_URL" ]; then
              echo "A ação 'conferir' precisa do campo api_url." >&2
              exit 1
            fi
            echo "Conferindo ambiente publicado."
            exit 0
          fi
          [ -n "$DATABASE_URL" ] || faltando+=("SUPABASE_DB_URL")
          if [ "${{ inputs.acao }}" = "setup" ]; then
            [ -n "$SUPABASE_URL" ] || faltando+=("SUPABASE_URL")
            [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || faltando+=("SUPABASE_SERVICE_ROLE_KEY")
            [ -n "$OWNER_EMAIL" ] || faltando+=("OWNER_EMAIL")
            [ -n "$OWNER_PASSWORD" ] || faltando+=("OWNER_PASSWORD")
          fi
          if [ ${#faltando[@]} -gt 0 ]; then
            echo "Faltam segredos: ${faltando[*]}" >&2
            echo "Cadastre em Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "Segredos presentes."

      - name: Status
        if: inputs.acao == 'status'
        run: npm run migrate -- --status

      - name: Migrations
        if: inputs.acao == 'migrate'
        run: npm run migrate

      - name: Instalação completa
        if: inputs.acao == 'setup'
        run: npm run setup

      - name: Conferir ambiente publicado
        if: inputs.acao == 'conferir'
        run: npm run smoke

      - name: Resumo
        if: always()
        run: echo "Ação '${{ inputs.acao }}' terminou com status ${{ job.status }}." >> "$GITHUB_STEP_SUMMARY"
